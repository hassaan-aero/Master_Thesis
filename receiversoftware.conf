[GNSS-SDR]

GNSS-SDR.telecommand_enabled=true
GNSS-SDR.telecommand_tcp_port=3333

;######### GLOBAL OPTIONS ##################
#GNSS-SDR.internal_fs_sps=4000000
GNSS-SDR.internal_fs_sps=2600000


;######### SIGNAL_SOURCE CONFIG ############
#SignalSource.implementation=UHD_Signal_Source
#SignalSource.device_address=192.168.10.2 ; <- PUT THE IP ADDRESS OF YOUR USRP HERE
#SignalSource.item_type=cshort
#SignalSource.sampling_frequency=4000000
#SignalSource.freq=1575420000
#SignalSource.gain=55
#SignalSource.subdevice=B:0  ; <- Can be A:0 or B:0
#SignalSource.samples=0
#SignalSource.clock_source=gpsdo


;######### SIGNAL_SOURCE CONFIG ############
SignalSource.implementation=File_Signal_Source
SignalSource.filename=./gpssim_complex.dat
SignalSource.item_type=gr_complex
SignalSource.sampling_frequency=2600000
SignalSource.samples=0
SignalSource.repeat=false


;######### SIGNAL_CONDITIONER CONFIG ############
SignalConditioner.implementation=Pass_Through

;######### DATA_TYPE_ADAPTER CONFIG ############
DataTypeAdapter.implementation=Pass_Through
DataTypeAdapter.item_type=gr_complex

;######### INPUT_FILTER CONFIG ############
#InputFilter.implementation=Fir_Filter
#InputFilter.input_item_type=cshort
#InputFilter.output_item_type=gr_complex
#InputFilter.taps_item_type=float
#InputFilter.number_of_taps=11
#InputFilter.number_of_bands=2

#InputFilter.band1_begin=0.0
#InputFilter.band1_end=0.48
#InputFilter.band2_begin=0.52
#InputFilter.band2_end=1.0

#InputFilter.ampl1_begin=1.0
#InputFilter.ampl1_end=1.0
#InputFilter.ampl2_begin=0.0
#InputFilter.ampl2_end=0.0

#InputFilter.band1_error=1.0
#InputFilter.band2_error=1.0

#InputFilter.filter_type=bandpass
#InputFilter.grid_density=16
#InputFilter.sampling_frequency=4000000
#InputFilter.IF=0



;######### RESAMPLER CONFIG ############
Resampler.implementation=Pass_Through

;######### CHANNELS GLOBAL CONFIG ############
#Channels_1C.count=8
Channels_1C.count=8
Channels.in_acquisition=1

;######### ACQUISITION GLOBAL CONFIG ############
Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition
Acquisition_1C.item_type=gr_complex
Acquisition_1C.coherent_integration_time_ms=1
#Acquisition_1C.coherent_integration_time_ms=4
Acquisition_1C.pfa=0.01
Acquisition_1C.doppler_max=5000
Acquisition_1C.doppler_step=25
Acquisition_1C.max_dwells=1
Acquisition_1C.dump=false
Acquisition_1C.dump_filename=./acq_dump.dat

;######### TRACKING GLOBAL CONFIG ############
Tracking_1C.implementation=GPS_L1_CA_DLL_PLL_Tracking
Tracking_1C.item_type=gr_complex
Tracking_1C.extend_correlation_symbols=1
Tracking_1C.early_late_space_chips=0.5
Tracking_1C.early_late_space_narrow_chips=0.15
#Tracking_1C.pll_bw_hz=40
#Tracking_1C.pll_bw_hz=15
#Tracking_1C.dll_bw_hz=2.0
#Tracking_1C.dll_bw_hz=0.7
#Tracking_1C.pll_bw_narrow_hz=5.0
#Tracking_1C.dll_bw_narrow_hz=1.50

#Tracking_1C.pll_bw_narrow_hz=3.0
#Tracking_1C.dll_bw_narrow_hz=0.3
#Tracking_1C.fll_bw_hz=10
#Tracking_1C.fll_bw_hz=5
#Tracking_1C.enable_fll_pull_in=true
#Tracking_1C.enable_fll_steady_state=false
Tracking_1C.pll_bw_hz=25
Tracking_1C.dll_bw_hz=2.0

Tracking_1C.pll_bw_narrow_hz=10.0
Tracking_1C.dll_bw_narrow_hz=1.0

Tracking_1C.fll_bw_hz=15
Tracking_1C.enable_fll_pull_in=true
Tracking_1C.enable_fll_steady_state=true
Tracking_1C.dump=false
Tracking_1C.dump_filename=tracking_ch_

;######### TELEMETRY DECODER GPS CONFIG ############
TelemetryDecoder_1C.implementation=GPS_L1_CA_Telemetry_Decoder

;######### OBSERVABLES CONFIG ############
Observables.implementation=Hybrid_Observables
Observables.dump=true
Observables.dump_filename=obs

;######### PVT CONFIG ############
PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
PVT.output_rate_ms=100
PVT.display_rate_ms=500
PVT.iono_model=Broadcast
PVT.trop_model=Saastamoinen
PVT.flag_rtcm_server=true
PVT.flag_rtcm_tty_port=true
PVT.rtcm_dump_devname=/dev/pts/1
PVT.rtcm_tcp_port=2101
PVT.rtcm_MT1019_rate_ms=5000
PVT.rtcm_MT1077_rate_ms=1000
PVT.rinex_version=3
PVT.rinex_filename=gnss_data
PVT.flag_rinex=true
PVT.enable_monitor=true
PVT.enable_protobuf=true
;PVT.monitor_client_addresses=172.16.0.6
;PVT.monitor_udp_port=1111

;Monitor.enable_monitor=true
;Monitor.enable_protobuf=true
;Monitor.decimation_factor=1
;Monitor.client_addresses=172.16.0.6
;Monitor.udp_port=1112


